name: Build Waveshare Gemini OS
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.2.2
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Waveshare Official LVGL Demo
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          OUT_DIR="$GITHUB_WORKSPACE/dist"
          mkdir -p "$OUT_DIR"

          echo "=== 1. Clonare repozitoriu Waveshare ==="
          git clone --depth 1 https://github.com/waveshareteam/ESP32-S3-Touch-LCD-3.49-V2.git ws

          echo "=== 2. Copiere binare existente din folderul Firmware ==="
          if [ -d "ws/Firmware" ]; then
            find ws/Firmware -type f -name "*.bin" -exec cp {} "$OUT_DIR/" \; || true
          fi

          echo "=== 3. Compilare 09_LVGL_V8_Test cu ESP-IDF v5.2.2 ==="
          cd ws/ESP-IDF/09_LVGL_V8_Test
          idf.py set-target esp32s3
          idf.py build

          cd build
          if [ -f flash_project_args ]; then
            esptool.py --chip esp32s3 merge_bin -o lvgl_demo_merged.bin --fill-flash-size 16MB @flash_project_args
          elif [ -f flash_args ]; then
            esptool.py --chip esp32s3 merge_bin -o lvgl_demo_merged.bin --fill-flash-size 16MB @flash_args
          fi
          
          cp lvgl_demo_merged.bin "$OUT_DIR/" || true
          find . -maxdepth 1 -name "*.bin" -exec cp {} "$OUT_DIR/" \; || true

          cd "$GITHUB_WORKSPACE"
          echo "=== 4. Fisiere finale pregatite ==="
          ls -la "$OUT_DIR"

      - name: Upload BIN Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: waveshare-official-bin
          path: dist/*

name: Build Native ESP-IDF Gemini OS
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3.1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate ESP-IDF Structure & Compile
        shell: bash
        run: |
          . /opt/esp/idf/export.sh

          mkdir -p main

          cat << 'EOF' > CMakeLists.txt
          cmake_minimum_required(VERSION 3.16)
          include($ENV{IDF_PATH}/tools/cmake/project.cmake)
          project(my-gemini-os)
          EOF

          cat << 'EOF' > partitions.csv
          # Name,   Type, SubType, Offset,  Size, Flags
          nvs,      data, nvs,     0x9000,  0x6000,
          phy_init, data, phy,     0xf000,  0x1000,
          factory,  app,  factory, 0x20000, 0xE00000,
          EOF

          cat << 'EOF' > sdkconfig.defaults
          CONFIG_IDF_TARGET="esp32s3"
          CONFIG_ESPTOOLPY_FLASHMODE_DIO=y
          CONFIG_ESPTOOLPY_FLASHFREQ_40M=y
          CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
          CONFIG_SPIRAM=y
          CONFIG_SPIRAM_MODE_OCT=y
          CONFIG_SPIRAM_SPEED_80M=y
          CONFIG_SPIRAM_BOOT_INIT=y
          CONFIG_SPIRAM_IGNORE_NOTFOUND=y
          CONFIG_ESP_CONSOLE_UART_DEFAULT=y
          CONFIG_ESP_CONSOLE_UART_BAUDRATE=115200
          CONFIG_PARTITION_TABLE_CUSTOM=y
          CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions.csv"
          EOF

          cat << 'EOF' > main/CMakeLists.txt
          idf_component_register(SRCS "main.c"
                                 INCLUDE_DIRS "."
                                 REQUIRES driver)
          EOF

          cat << 'EOF' > main/main.c
          #include <stdio.h>
          #include "freertos/FreeRTOS.h"
          #include "freertos/task.h"
          #include "driver/i2c.h"
          #include "driver/gpio.h"
          #include "esp_log.h"
          #include "esp_system.h"

          static const char *TAG = "GEMINI_OS";

          #define I2C_MASTER_SDA_IO 2
          #define I2C_MASTER_SCL_IO 1
          #define I2C_MASTER_NUM    I2C_NUM_0
          #define TCA9554_ADDR      0x20
          #define BOOT_BUTTON_GPIO  GPIO_NUM_0
          #define LCD_BL_GPIO       GPIO_NUM_6

          static void i2c_master_init(void) {
              i2c_config_t conf = {
                  .mode = I2C_MODE_MASTER,
                  .sda_io_num = I2C_MASTER_SDA_IO,
                  .sda_pullup_en = GPIO_PULLUP_ENABLE,
                  .scl_io_num = I2C_MASTER_SCL_IO,
                  .scl_pullup_en = GPIO_PULLUP_ENABLE,
                  .master.clk_speed = 100000,
              };
              i2c_param_config(I2C_MASTER_NUM, &conf);
              i2c_driver_install(I2C_MASTER_NUM, conf.mode, 0, 0, 0);
          }

          static void tca9554_write(uint8_t reg, uint8_t data) {
              i2c_cmd_handle_t cmd = i2c_cmd_link_create();
              i2c_master_start(cmd);
              i2c_master_write_byte(cmd, (TCA9554_ADDR << 1) | I2C_MASTER_WRITE, true);
              i2c_master_write_byte(cmd, reg, true);
              i2c_master_write_byte(cmd, data, true);
              i2c_master_stop(cmd);
              i2c_master_cmd_begin(I2C_MASTER_NUM, cmd, pdMS_TO_TICKS(100));
              i2c_cmd_link_delete(cmd);
          }

          void app_main(void) {
              ESP_LOGI(TAG, "GEMINI OS NATIV ACTIVAT");

              i2c_master_init();
              tca9554_write(0x03, 0x00);
              tca9554_write(0x01, 0xFF);

              gpio_config_t bl_conf = {
                  .pin_bit_mask = (1ULL << LCD_BL_GPIO),
                  .mode = GPIO_MODE_OUTPUT,
                  .pull_up_en = GPIO_PULLUP_ENABLE,
              };
              gpio_config(&bl_conf);
              gpio_set_level(LCD_BL_GPIO, 1);

              gpio_config_t btn_conf = {
                  .pin_bit_mask = (1ULL << BOOT_BUTTON_GPIO),
                  .mode = GPIO_MODE_INPUT,
                  .pull_up_en = GPIO_PULLUP_ENABLE,
              };
              gpio_config(&btn_conf);

              bool state = true;
              while (1) {
                  if (gpio_get_level(BOOT_BUTTON_GPIO) == 0) {
                      state = !state;
                      gpio_set_level(LCD_BL_GPIO, state ? 1 : 0);
                      ESP_LOGI(TAG, "Backlight comutat: %s", state ? "PORNIT" : "OPRIT");
                      vTaskDelay(pdMS_TO_TICKS(350));
                  }
                  vTaskDelay(pdMS_TO_TICKS(50));
              }
          }
          EOF

          idf.py set-target esp32s3
          idf.py build

          cd build
          if [ -f flash_project_args ]; then
            esptool.py --chip esp32s3 merge_bin -o gemini-os-esp-idf-merged.bin --fill-flash-size 16MB @flash_project_args
          else
            esptool.py --chip esp32s3 merge_bin -o gemini-os-esp-idf-merged.bin --flash_mode dio --flash_freq 40m --flash_size 16MB --fill-flash-size 16MB 0x0 bootloader/bootloader.bin 0x9000 partition_table/partition-table.bin 0x20000 my-gemini-os.bin
          fi
          mkdir -p ../dist
          cp gemini-os-esp-idf-merged.bin ../dist/

      - name: Upload Merged BIN
        uses: actions/upload-artifact@v4
        with:
          name: gemini-os-esp-idf-bin
          path: ./dist/*.bin

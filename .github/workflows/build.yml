name: Build Waveshare Gemini OS
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3.1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Official Waveshare Repo & Build
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          mkdir -p dist

          echo "=== 1. Descarcare cod oficial Waveshare ==="
          git clone --depth 1 https://github.com/waveshareteam/ESP32-S3-Touch-LCD-3.49-V2.git ws

          echo "=== 2. Copiere binare existente ==="
          find ws/ -type f \( -name "*.bin" -o -name "*.merged.bin" \) -exec cp {} dist/ \; || true

          echo "=== 3. Compilare proiect ESP-IDF Waveshare ==="
          if [ -d "ws/ESP-IDF" ]; then
            cd ws/ESP-IDF
            PROJ_DIR=$(find . -maxdepth 2 -name "CMakeLists.txt" -exec dirname {} \; | head -n 1)
            if [ -n "$PROJ_DIR" ]; then
              cd "$PROJ_DIR"
              idf.py set-target esp32s3 || true
              idf.py build || true
              if [ -f flash_project_args ]; then
                esptool.py --chip esp32s3 merge_bin -o waveshare-merged.bin --fill-flash-size 16MB @flash_project_args || true
                cp waveshare-merged.bin ../../../dist/ || true
              fi
              find build/ -name "*.bin" -exec cp {} ../../../dist/ \; || true
            fi
            cd ../../
          fi

          echo "=== 4. Fisiere pregatite pentru descarcare ==="
          ls -la dist/

      - name: Upload BIN Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gemini-os-esp-idf-bin
          path: dist/*

name: Build Native ESP-IDF Gemini OS
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3.1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate ESP-IDF Structure & Compile
        shell: bash
        run: |
          . /opt/esp/idf/export.sh

          mkdir -p main components/esp_lcd_axs15231b/include

          # 1. CMakeLists principal
          cat << 'EOF' > CMakeLists.txt
          cmake_minimum_required(VERSION 3.16)
          include($ENV{IDF_PATH}/tools/cmake/project.cmake)
          project(my-gemini-os)
          EOF

          # 2. Configurare hardware Waveshare ESP32-S3R8 cu USB Serial JTAG
          cat << 'EOF' > sdkconfig.defaults
          CONFIG_IDF_TARGET="esp32s3"
          CONFIG_ESPTOOLPY_FLASHMODE_DIO=y
          CONFIG_ESPTOOLPY_FLASHFREQ_40M=y
          CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
          CONFIG_SPIRAM=y
          CONFIG_SPIRAM_MODE_OCT=y
          CONFIG_SPIRAM_SPEED_80M=y
          CONFIG_SPIRAM_BOOT_INIT=y
          CONFIG_SPIRAM_IGNORE_NOTFOUND=y
          CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y
          CONFIG_ESP_CONSOLE_SECONDARY_NONE=y
          EOF

          # 3. Componenta Driver AXS15231B
          cat << 'EOF' > components/esp_lcd_axs15231b/CMakeLists.txt
          idf_component_register(SRCS "esp_lcd_axs15231b.c"
                                 INCLUDE_DIRS "include"
                                 REQUIRES esp_lcd)
          EOF

          cat << 'EOF' > components/esp_lcd_axs15231b/include/esp_lcd_axs15231b.h
          #pragma once
          #include "esp_lcd_panel_vendor.h"
          #include "esp_lcd_panel_ops.h"
          esp_err_t esp_lcd_new_panel_axs15231b(const esp_lcd_panel_io_handle_t io, const esp_lcd_panel_dev_config_t *panel_dev_config, esp_lcd_panel_handle_t *ret_panel);
          EOF

          cat << 'EOF' > components/esp_lcd_axs15231b/esp_lcd_axs15231b.c
          #include "freertos/FreeRTOS.h"
          #include "freertos/task.h"
          #include "esp_lcd_panel_interface.h"
          #include "esp_lcd_panel_io.h"
          #include "esp_lcd_axs15231b.h"

          static esp_err_t panel_axs15231b_init(esp_lcd_panel_t *panel);
          static esp_err_t panel_axs15231b_draw_bitmap(esp_lcd_panel_t *panel, int x_start, int y_start, int x_end, int y_end, const void *color_data);
          static esp_err_t panel_axs15231b_invert_color(esp_lcd_panel_t *panel, bool invert_color_data);

          typedef struct {
              esp_lcd_panel_t base;
              esp_lcd_panel_io_handle_t io;
          } axs15231b_panel_t;

          esp_err_t esp_lcd_new_panel_axs15231b(const esp_lcd_panel_io_handle_t io, const esp_lcd_panel_dev_config_t *panel_dev_config, esp_lcd_panel_handle_t *ret_panel) {
              axs15231b_panel_t *axs = calloc(1, sizeof(axs15231b_panel_t));
              axs->io = io;
              axs->base.init = panel_axs15231b_init;
              axs->base.draw_bitmap = panel_axs15231b_draw_bitmap;
              axs->base.invert_color = panel_axs15231b_invert_color;
              *ret_panel = &(axs->base);
              return ESP_OK;
          }

          static esp_err_t panel_axs15231b_init(esp_lcd_panel_t *panel) {
              axs15231b_panel_t *axs = __containerof(panel, axs15231b_panel_t, base);
              esp_lcd_panel_io_handle_t io = axs->io;

              // Sleep Out
              esp_lcd_panel_io_tx_param(io, 0x11, NULL, 0);
              vTaskDelay(pdMS_TO_TICKS(120));

              // Format pixel: 16-bit RGB565 (0x55)
              uint8_t colmod[] = {0x55};
              esp_lcd_panel_io_tx_param(io, 0x3A, colmod, 1);

              // Directie afisare RGB
              uint8_t madctl[] = {0x00};
              esp_lcd_panel_io_tx_param(io, 0x36, madctl, 1);

              // Display ON
              esp_lcd_panel_io_tx_param(io, 0x29, NULL, 0);
              vTaskDelay(pdMS_TO_TICKS(50));
              return ESP_OK;
          }

          static esp_err_t panel_axs15231b_draw_bitmap(esp_lcd_panel_t *panel, int x_start, int y_start, int x_end, int y_end, const void *color_data) {
              axs15231b_panel_t *axs = __containerof(panel, axs15231b_panel_t, base);
              esp_lcd_panel_io_handle_t io = axs->io;

              uint8_t caset[] = { (x_start >> 8) & 0xFF, x_start & 0xFF, ((x_end - 1) >> 8) & 0xFF, (x_end - 1) & 0xFF };
              esp_lcd_panel_io_tx_param(io, 0x2A, caset, 4);

              uint8_t raset[] = { (y_start >> 8) & 0xFF, y_start & 0xFF, ((y_end - 1) >> 8) & 0xFF, (y_end - 1) & 0xFF };
              esp_lcd_panel_io_tx_param(io, 0x2B, raset, 4);

              size_t len = (x_end - x_start) * (y_end - y_start) * 2;
              esp_lcd_panel_io_tx_color(io, 0x2C, color_data, len);
              return ESP_OK;
          }

          static esp_err_t panel_axs15231b_invert_color(esp_lcd_panel_t *panel, bool invert) {
              axs15231b_panel_t *axs = __containerof(panel, axs15231b_panel_t, base);
              esp_lcd_panel_io_tx_param(axs->io, invert ? 0x21 : 0x20, NULL, 0);
              return ESP_OK;
          }
          EOF

          # 4. Configurare componenta aplicatie
          cat << 'EOF' > main/CMakeLists.txt
          idf_component_register(SRCS "main.c"
                                 INCLUDE_DIRS "."
                                 REQUIRES driver esp_lcd esp_lcd_axs15231b)
          EOF

          # 5. Cod C nativ cu desenare sigura prin DMA in bucati mici de memorie
          cat << 'EOF' > main/main.c
          #include <stdio.h>

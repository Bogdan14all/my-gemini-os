name: Build Gemini OS BIN
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv bin/arduino-cli /usr/local/bin/

      - name: Setup ESP32 Core & Libraries
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.0.7
          arduino-cli lib install "GFX Library for Arduino@1.5.0"

      - name: Compile to .BIN
        run: |
          mkdir -p build
          if [ -f gemini_os.ino ]; then mv gemini_os.ino my-gemini-os.ino; fi
          arduino-cli compile --fqbn esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,FlashMode=dio \
            --output-dir ./build .

      - name: Upload .BIN Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-os-waveshare-bin
          path: ./build/*.bin

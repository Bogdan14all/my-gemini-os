name: Build Native ESP-IDF Gemini OS
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3.1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate ESP-IDF Structure & Compile
        shell: bash
        run: |
          . /opt/esp/idf/export.sh

          mkdir -p main components/esp_lcd_axs15231b/include

          # 1. CMakeLists principal
          cat << 'EOF' > CMakeLists.txt
          cmake_minimum_required(VERSION 3.16)
          include($ENV{IDF_PATH}/tools/cmake/project.cmake)
          project(my-gemini-os)
          EOF

          # 2. Configurare hardware ESP32-S3R8
          cat << 'EOF' > sdkconfig.defaults
          CONFIG_IDF_TARGET="esp32s3"
          CONFIG_ESPTOOLPY_FLASHMODE_DIO=y
          CONFIG_ESPTOOLPY_FLASHFREQ_40M=y
          CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
          CONFIG_SPIRAM=y
          CONFIG_SPIRAM_MODE_OCT=y
          CONFIG_SPIRAM_SPEED_80M=y
          CONFIG_SPIRAM_BOOT_INIT=y
          CONFIG_SPIRAM_IGNORE_NOTFOUND=y
          CONFIG_ESP_CONSOLE_UART_DEFAULT=y
          CONFIG_ESP_CONSOLE_UART_BAUDRATE=115200
          EOF

          # 3. Componenta Driver AXS15231B
          cat << 'EOF' > components/esp_lcd_axs15231b/CMakeLists.txt
          idf_component_register(SRCS "esp_lcd_axs15231b.c"
                                 INCLUDE_DIRS "include"
                                 REQUIRES esp_lcd)
          EOF

          cat << 'EOF' > components/esp_lcd_axs15231b/include/esp_lcd_axs15231b.h
          #pragma once
          #include "esp_lcd_panel_vendor.h"
          #include "esp_lcd_panel_ops.h"
          esp_err_t esp_lcd_new_panel_axs15231b(const esp_lcd_panel_io_handle_t io, const esp_lcd_panel_dev_config_t *panel_dev_config, esp_lcd_panel_handle_t *ret_panel);
          EOF

          cat << 'EOF' > components/esp_lcd_axs15231b/esp_lcd_axs15231b.c
          #include "freertos/FreeRTOS.h"
          #include "freertos/task.h"
          #include "esp_lcd_panel_interface.h"
          #include "esp_lcd_panel_io.h"
          #include "esp_lcd_axs15231b.h"

          static esp_err_t panel_axs15231b_init(esp_lcd_panel_t *panel);
          static esp_err_t panel_axs15231b_draw_bitmap(esp_lcd_panel_t *panel, int x_start, int y_start, int x_end, int y_end, const void *color_data);
          static esp_err_t panel_axs15231b_invert_color(esp_lcd_panel_t *panel, bool invert_color_data);

          typedef struct {
              esp_lcd_panel_t base;
              esp_lcd_panel_io_handle_t io;
          } axs15231b_panel_t;

          esp_err_t esp_lcd_new_panel_axs15231b(const esp_lcd_panel_io_handle_t io, const esp_lcd_panel_dev_config_t *panel_dev_config, esp_lcd_panel_handle_t *ret_panel) {
              axs15231b_panel_t *axs = calloc(1, sizeof(axs15231b_panel_t));
              axs->io = io;
              axs->base.init = panel_axs15231b_init;
              axs->base.draw_bitmap = panel_axs15231b_draw_bitmap;
              axs->base.invert_color = panel_axs15231b_invert_color;
              *ret_panel = &(axs->base);
              return ESP_OK;
          }

          static esp_err_t panel_axs15231b_init(esp_lcd_panel_t *panel) {
              axs15231b_panel_t *axs = __containerof(panel, axs15231b_panel_t, base);
              esp_lcd_panel_io_handle_t io = axs->io;
              esp_lcd_panel_io_tx_param(io, 0x11, NULL, 0);
              vTaskDelay(pdMS_TO_TICKS(120));
              uint8_t d1[] = {0x5A, 0x5A}; esp_lcd_panel_io_tx_param(io, 0x36, d1, 2);
              uint8_t d2[] = {0x00}; esp_lcd_panel_io_tx_param(io, 0x3A, d2, 1);
              esp_lcd_panel_io_tx_param(io, 0x29, NULL, 0);
              vTaskDelay(pdMS_TO_TICKS(50));
              return ESP_OK;
          }

          static esp_err_t panel_axs15231b_draw_bitmap(esp_lcd_panel_t *panel, int x_start, int y_start, int x_end, int y_end, const void *color_data) {
              axs15231b_panel_t *axs = __containerof(panel, axs15231b_panel_t, base);
              esp_lcd_panel_io_handle_t io = axs->io;
              uint8_t caset[] = { (x_start>>8)&0xFF, x_start&0xFF, ((x_end-1)>>8)&0xFF, (x_end-1)&0xFF };
              esp_lcd_panel_io_tx_param(io, 0x2A, caset, 4);
              uint8_t raset[] = { (y_start>>8)&0xFF, y_start&0xFF, ((y_end-1)>>8)&0xFF, (y_end-1)&0xFF };
              esp_lcd_panel_io_tx_param(io, 0x2B, raset, 4);
              size_t len = (x_end - x_start) * (y_end - y_start) * 2;
              esp_lcd_panel_io_tx_color(io, 0x2C, color_data, len);
              return ESP_OK;
          }

          static esp_err_t panel_axs15231b_invert_color(esp_lcd_panel_t *panel, bool invert) {
              axs15231b_panel_t *axs = __containerof(panel, axs15231b_panel_t, base);
              esp_lcd_panel_io_tx_param(axs->io, invert ? 0x21 : 0x20, NULL, 0);
              return ESP_OK;
          }
          EOF

          # 4. Configurare componenta aplicatie
          cat << 'EOF' > main/CMakeLists.txt
          idf_component_register(SRCS "main.c"
                                 INCLUDE_DIRS "."
                                 REQUIRES driver esp_lcd esp_lcd_axs15231b)
          EOF

          # 5. Cod C nativ (Ecran Rosu + Activare Alimentare)
          cat << 'EOF' > main/main.c
          #include <stdio.h>
          #include "freertos/FreeRTOS.h"
          #include "freertos/task.h"
          #include "driver/i2c.h"
          #include "driver/spi_master.h"
          #include "driver/gpio.h"
          #include "esp_lcd_panel_io.h"
          #include "esp_lcd_panel_ops.h"
          #include "esp_log.h"
          #include "esp_lcd_axs15231b.h"

          static const char *TAG = "GEMINI_OS";

          #define LCD_HOST       SPI2_HOST
          #define LCD_PIXEL_CLK  (40 * 1000 * 1000)
          #define PIN_NUM_CS     11
          #define PIN_NUM_SCLK   12
          #define PIN_NUM_DATA0  10
          #define PIN_NUM_DATA1  14
          #define PIN_NUM_DATA2  15
          #define PIN_NUM_DATA3  13
          #define PIN_NUM_RST    9
          #define I2C_SDA_IO     2
          #define I2C_SCL_IO     1
          #define TCA9554_ADDR   0x20

          static void tca9554_write(uint8_t reg, uint8_t data) {
              i2c_cmd_handle_t cmd = i2c_cmd_link_create();
              i2c_master_start(cmd);
              i2c_master_write_byte(cmd, (TCA9554_ADDR << 1) | I2C_MASTER_WRITE, true);
              i2c_master_write_byte(cmd, reg, true);
              i2c_master_write_byte(cmd, data, true);
              i2c_master_stop(cmd);
              i2c_master_cmd_begin(I2C_NUM_0, cmd, pdMS_TO_TICKS(100));
              i2c_cmd_link_delete(cmd);
          }

          void app_main(void) {
              ESP_LOGI(TAG, "INITIALIZARE DRIVER NATIV AXS15231B");

              i2c_config_t conf = { .mode = I2C_MODE_MASTER, .sda_io_num = I2C_SDA_IO, .sda_pullup_en = 1, .scl_io_num = I2C_SCL_IO, .scl_pullup_en = 1, .master.clk_speed = 100000 };
              i2c_param_config(I2C_NUM_0, &conf);
              i2c_driver_install(I2C_NUM_0, conf.mode, 0, 0, 0);
              tca9554_write(0x03, 0x00);
              tca9554_write(0x01, 0xFF);
              vTaskDelay(pdMS_TO_TICKS(100));

              spi_bus_config_t buscfg = {
                  .sclk_io_num = PIN_NUM_SCLK, .data0_io_num = PIN_NUM_DATA0, .data1_io_num = PIN_NUM_DATA1,
                  .data2_io_num = PIN_NUM_DATA2, .data3_io_num = PIN_NUM_DATA3, .max_transfer_sz = 172 * 640 * 2
              };
              spi_bus_initialize(LCD_HOST, &buscfg, SPI_DMA_CH_AUTO);

              esp_lcd_panel_io_handle_t io_handle = NULL;
              esp_lcd_panel_io_spi_config_t io_config = {
                  .cs_gpio_num = PIN_NUM_CS, .pclk_hz = LCD_PIXEL_CLK, .spi_mode = 0,
                  .lcd_cmd_bits = 8, .lcd_param_bits = 8, .trans_queue_depth = 10,
                  .flags.octal_mode = 0, .flags.quad_mode = 1
              };
              esp_lcd_new_panel_io_spi((esp_lcd_spi_bus_handle_t)LCD_HOST, &io_config, &io_handle);

              esp_lcd_panel_handle_t panel_handle = NULL;
              esp_lcd_panel_dev_config_t panel_config = {
                  .reset_gpio_num = PIN_NUM_RST, .rgb_ele_order = LCD_RGB_ELEMENT_ORDER_RGB,
                  .bits_per_pixel = 16,
              };
              esp_lcd_new_panel_axs15231b(io_handle, &panel_config, &panel_handle);

              esp_lcd_panel_reset(panel_handle);
              esp_lcd_panel_init(panel_handle);
              esp_lcd_panel_invert_color(panel_handle, true);

              uint16_t *color_buffer = malloc(172 * 640 * 2);
              for(int i = 0; i < 172 * 640; i++) color_buffer[i] = 0xF800; // ROSU
              esp_lcd_panel_draw_bitmap(panel_handle, 0, 0, 172, 640, color_buffer);
              ESP_LOGI(TAG, "ECRAN ACTIV SI COLORAT!");

              while (1) { vTaskDelay(pdMS_TO_TICKS(1000)); }
          }
          EOF

          # 6. Compilare si unire binar
          idf.py set-target esp32s3
          idf.py build

          esptool.py --chip esp32s3 merge_bin -o gemini-os-esp-idf-merged.bin \
            --flash_mode dio --flash_freq 40m --flash_size 16MB \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x10000 build/my-gemini-os.bin

      - name: Upload BIN Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gemini-os-esp-idf-bin
          path: |
            gemini-os-esp-idf-merged.bin
            build/*.bin
